name: Build and Deploy to loukiatsiota.gr

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npx astro build

      - name: Deploy to FTP (loukiatsiota.gr)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.loukiatsiota.gr
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
          exclude: |
            **/.htaccess
            **/.well-known/**
            **/google284346e2a4b90253.html
            **/.user.ini
            **/php.ini
            **/error_log
